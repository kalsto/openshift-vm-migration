---
# ============================================================
# APPLIANCE_LOCALACCOUNTS_INFO TESTS
# ============================================================

# Test 1: List local accounts when none exist (empty list)
- name: List local accounts (empty)
  vmware.vmware_rest.appliance_localaccounts_info: {}
  register: list_empty

- name: Assert empty list is returned
  ansible.builtin.assert:
    that:
      - list_empty.info is defined
      - list_empty.info | length == 0
      - list_empty.value | length == 0
      - not list_empty.changed

# Test 2: Get a single local account by username
- name: Reset before get expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for get
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Appliance.LocalAccounts_get: "200"

- name: Get local account by username
  vmware.vmware_rest.appliance_localaccounts_info:
    username: root
  register: get_by_id

- name: Assert account details are returned
  ansible.builtin.assert:
    that:
      - get_by_id.value is defined
      - get_by_id.value.fullname == 'root user'
      - get_by_id.value.email == 'root@localhost'
      - get_by_id.value.enabled
      - get_by_id.value.roles is defined
      - "'superAdmin' in get_by_id.value.roles"
      - get_by_id.info is defined
      - get_by_id.info | length == 1
      - get_by_id.info[0].fullname == 'root user'
      - not get_by_id.changed

# Test 3: List multiple local accounts (list endpoint returns identifiers,
# module enriches each with its detailed GET response)
- name: Reset before multiple list expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for multiple accounts
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/list_multiple.json"
      operationsAndResponses:
        Appliance.LocalAccounts_list: "200"
        Appliance.LocalAccounts_get: "200"

- name: List local accounts (multiple)
  vmware.vmware_rest.appliance_localaccounts_info: {}
  register: list_multiple

- name: Assert multiple accounts are returned and enriched
  ansible.builtin.assert:
    that:
      - list_multiple.info is defined
      - list_multiple.info | length == 2
      - list_multiple.value | length == 2
      - list_multiple.info | map(attribute='username') | list | sort == ['root', 'test_user']
      - list_multiple.info[0].enabled is defined
      - list_multiple.info[0].roles is defined
      - not list_multiple.changed

# Test 4: Check mode returns the same read-only result without error
- name: List local accounts (check mode)
  vmware.vmware_rest.appliance_localaccounts_info: {}
  check_mode: true
  register: list_check

- name: Assert check mode reports no change for read-only info module
  ansible.builtin.assert:
    that:
      - list_check.info | length == 2
      - not list_check.changed
