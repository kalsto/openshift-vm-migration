---
- name: Test appliance_monitoring_query module against MockServer
  environment: "{{ environment_auth_vars }}"
  block:
    - name: Load default API spec expectations
      ansible.builtin.uri:
        url: "{{ mockserver_url }}/mockserver/openapi"
        method: PUT
        status_code: [200, 201]
        body_format: json
        body:
          specUrlOrPayload: "file:/mockserver_specs/default.json"
          operationsAndResponses:
            Appliance.Monitoring.Query_get: "200"

    - name: Include query tests
      ansible.builtin.include_tasks: query.yml
