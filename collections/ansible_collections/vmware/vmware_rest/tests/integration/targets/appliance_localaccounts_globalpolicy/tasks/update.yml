---
# ============================================================
# APPLIANCE_LOCALACCOUNTS_GLOBALPOLICY UPDATE TESTS
# ============================================================
# The module reads the current policy (GET), compares it with the
# supplied values, and issues a PUT only when they differ.
#   default.json -> original policy (max_days=90, min_days=1, warn_days=7, minimum_length=8)
#   updated.json -> policy after the update below (max_days=60, min_days=2, warn_days=14, minimum_length=12)

# Test 1: Initial update (values differ from current state)
- name: Reset before update expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for update
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Appliance.LocalAccounts.GlobalPolicy_get: "200"
        Appliance.LocalAccounts.GlobalPolicy_update: "204"

- name: Update the global password policy
  vmware.vmware_rest.appliance_localaccounts_globalpolicy:
    max_days: 60
    min_days: 2
    warn_days: 14
    minimum_length: 12
    state: present
  register: update_result

- name: Assert update reports a change
  ansible.builtin.assert:
    that:
      - update_result.changed
      - update_result.diff.max_days.before == 90
      - update_result.diff.max_days.after == 60
      - update_result.diff.minimum_length.after == 12

# Test 2: Idempotent update (current state already matches)
- name: Reset before updated state expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for updated state
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/updated.json"
      operationsAndResponses:
        Appliance.LocalAccounts.GlobalPolicy_get: "200"
        Appliance.LocalAccounts.GlobalPolicy_update: "204"

- name: Update the global password policy again (idempotent)
  vmware.vmware_rest.appliance_localaccounts_globalpolicy:
    max_days: 60
    min_days: 2
    warn_days: 14
    minimum_length: 12
    state: present
  register: update_again

- name: Assert no change on idempotent update
  ansible.builtin.assert:
    that:
      - not update_again.changed

# Test 3: Check mode when an update would occur
- name: Reset before check mode update expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec for original state
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Appliance.LocalAccounts.GlobalPolicy_get: "200"
        Appliance.LocalAccounts.GlobalPolicy_update: "204"

- name: Update the global password policy in check mode (would change)
  vmware.vmware_rest.appliance_localaccounts_globalpolicy:
    max_days: 60
    min_days: 2
    warn_days: 14
    minimum_length: 12
    state: present
  check_mode: true
  register: update_check

- name: Assert check mode reports change when updating
  ansible.builtin.assert:
    that:
      - update_check.changed

# Test 4: Check mode when no update is needed
- name: Reset before idempotent check mode update expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec for updated state
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/updated.json"
      operationsAndResponses:
        Appliance.LocalAccounts.GlobalPolicy_get: "200"
        Appliance.LocalAccounts.GlobalPolicy_update: "204"

- name: Update the global password policy in check mode (no change)
  vmware.vmware_rest.appliance_localaccounts_globalpolicy:
    max_days: 60
    min_days: 2
    warn_days: 14
    minimum_length: 12
    state: present
  check_mode: true
  register: update_check_idem

- name: Assert check mode reports no change when already updated
  ansible.builtin.assert:
    that:
      - not update_check_idem.changed
