---
# Environment Identifier
environment_type: "prod"

# OpenShift Target Cluster Settings
openshift_host: "https://api.prod-cluster.example.com:443"
openshift_username: "cluster-admin"
aap_namespace: "ansible-automation-platform"
aap_instance_name: "aap"

# Storage & Deployment Settings
storage_class: "gp3-csi-rosa-kms"
aap_license_manifest: "{{ playbook_dir }}/../files/prod_manifest.zip"

# AWS & RDS Settings
aws_region: "us-east-2"
cluster_identifier: "prod-rosa-cluster"
rds_instance_id: "aap-postgres-db-prod"
rds_subnet_group_name: "aap-rds-subnet-group-prod"
rds_sg_name: "aap-rds-sg-prod"
db_engine_version: "15"
db_instance_class: "db.m6g.xlarge"
allocated_storage_gb: 100
db_master_user: "aap_admin"
db_app_user: "aap_user"

# K8s Database Secret Names
gateway_db_secret: "rds-gateway-configuration"
controller_db_secret: "rds-controller-configuration"
hub_db_secret: "rds-hub-configuration"
eda_db_secret: "rds-eda-configuration"

# AAP Configuration Parameters
aap_organization: "Production-Organization"
fallback_aap_url: "https://aap.apps.prod-cluster.example.com"

# Automation Hub Remotes
ah_collection_remotes:
  - name: "rh-certified"
    url: "https://console.redhat.com/api/automation-hub/"
    auth_url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token"
    token: "{{ rh_offline_token }}"
    requirements:
      - "redhat.openshift"
      - "redhat.openshift_virtualization"
      - "ansible.controller"
      - "kubernetes.core"
      - "vmware.vmware_rest"
  - name: "community"
    url: "https://galaxy.ansible.com/api/"
    requirements:
      - "community.vmware"
      - "community.general"
      - "community.crypto"
      - "community.postgresql"

# Migration Parameters
mtv_namespace: "openshift-mtv"
target_namespace: "prod-cluster"
vsphere_port_group: "segment-prod-migration"
vsphere_datastore: "prod-workloadshare"
target_storage_class: "ocs-external-storagecluster-ceph-rbd"