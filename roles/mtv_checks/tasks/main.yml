---
# tasks file for mtv_checks
# Batch Scan mode will look at the vsphere inventory in AAP, and then do the vmware checks for each vm in the limit variable
# Seed scan mode will look at the ocp seed cluster and check for known configuration requirements there
# Migration mode will look at both batch scan and vm pre-checks (ip address, fqdn, vmware tools, local account, etc)


# Batch scan will require vmware endpoint - pulled from the mtv_ocp_short variable (which would also be the inventory name)
# -- alternatively, it needs an extra variable with vsphere_host passed in
# migration scan will require vmware endpoint, ocp enddpiont, and ocp cluster details
- name: "{{ role_name }} | main | initial fork - batch vs seed vs migration"
  ansible.builtin.assert:
    that:
      - check_mode is defined and check_mode in allowed_check_mode
      - mtv_ocp_short is defined and mtv_ocp_short in allowed_mtv_ocp_short
    fail_msg: "Please check mandatory inputs. check_mode and mtv_ocp_short are required"

- name: "{{ role_name }} | batch_checks | Assert limit is provided"
  ansible.builtin.assert:
    that:
      - ansible_limit is defined
      - ansible_limit | length > 0
      - ansible_limit != 'all'
    fail_msg: "You must provide a limit of which vm's are to be checked for now"

- name: "{{ role_name }} | main | include cluster variables via mtv_ocp_short variable"
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../vars/cluster_vars/{{ mtv_ocp_short }}_vault.yml"

- name: "{{ role_name }} | common | include common checks"
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../vars/checks/common.yml"

- name: "{{ role_name }} | main | migration check block"
  block:
    - name: "{{ role_name }} | main | prepare migration checks"
      ansible.builtin.include_tasks:
        file: "migration_checks.yml"
    
    - name: "{{ role_name }} | main | set check target"
      ansible.builtin.set_fact: 
        precheck_target: "{{ target }}"

  when: check_mode == 'migration'

# - name: "{{ role_name }} | main | batch check block"
#   block:
#     - name: "{{ role_name }} main | prepare batch checks"
#       ansible.builtin.include_tasks:
#         file: "batch_checks.yml"
#   when: check_mode == 'batch'

- name: "{{ role_name }} | main | ocp seed check block"
  block:
    - name: "{{ role_name }} | main | set check target"
      ansible.builtin.set_fact:
        precheck_target: ocp
    - name: "{{ role_name }} | main | nad"
      ansible.builtin.include_tasks: 
        file: "nad.yml"
  when: check_mode == 'seed'

- name: "{{ role_name }} | main | setup summary variable and target"
  ansible.builtin.set_fact:
    precheck_summary: []
    precheck_target: "{{ ansible_play_batch }}"

- name: "{{ role_name }} | main | Execute MTV Blocker Checks"
  ansible.builtin.include_tasks: check_blockers.yml
  loop: "{{ precheck_target }}"
  loop_control:
    loop_var: target

- name: "{{ role_name }} | main | display summary report"
  ansible.builtin.debug:
    msg: |
      ========================================
            Pre-Flight Migration Summary
      ========================================
      {% for target in precheck_summary %}
      TARGET NAME: {{ target.vm_name }} | OVERALL STATUS: {{ target.overall_status }}
      ----------------------------------------
      CHECKS EXECUTED:
      {% for check in target.checks %}
        [{{ 'PASS' if check.passed else 'FAIL' }}] ({{ check.type | upper }}) {{ check.name | ljust(30) }} : {{ check.message }}
      {% endfor %}
      ========================================
      {% endfor %}


