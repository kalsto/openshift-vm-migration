- name: "{{ role_name }} | vmware | Debug before Gather VM facts from vsphere"
  ansible.builtin.debug:
    msg:
      - "vsphere_host: {{ vsphere_host }}"
      - "target: {{ target }}"
  when: tt_debug | default(False) | bool


- name: "{{ role_name }} | vmware | Gather VM facts from vsphere"
  vmware.vmware.vm_info:
    hostname: "{{ vsphere_host }}"
    username: "{{ vsphere_username }}"
    password: "{{ vsphere_password }}"
    validate_certs: false
    datacenter: "{{ mtv_vsphere_datacenter | default(omit) }}"
    guest_name: "{{ target }}"
  delegate_to: localhost
  register: vm_facts

- name: "{{ role_name }} | vmware | Display Gather VM facts from vsphere"
  ansible.builtin.debug:
    msg:
      - "vm_facts: {{ vm_facts.guests | default('Facts not available') }}"
  when: mtv_tt_debug | default(False) | bool
