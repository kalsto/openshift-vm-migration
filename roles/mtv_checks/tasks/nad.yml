---
- name: "{{ role_name }} | nad | collect existing nad definitions"
  kubernetes.core.k8s_info:
    api_version: k8s.cni.cncf.io/v1
    kind: NetworkAttachmentDefinition
    namespace: "default"
  register: ocp_existing_nads

- name: "{{ role_name }} | nad | debug some of the variables, and make sure ocp_existing_nads exists"
  ansible.builtin.debug:
    msg:
      - "ocp_nad_naming_convention is: {{ ocp_nad_naming_convention }}"
      - "ocp_required_vlans is: {{ ocp_required_vlans }}"
      - "ocp_existing_nads is: {{ ocp_existing_nads }}"
  when: tt_debug | default('False') | bool


- name: "{{ role_name }} | nad | set fact for expected and existing nads"
  ansible.builtin.set_fact:
    #expected_nad_names: "{{ ocp_required_vlans | map('format', ocp_nad_naming_convention) | list }}"
    expected_nad_names: "{{ ocp_required_vlans | map('regex_replace', '^', ocp_nad_naming_convention) | list }}"
    existing_nad_names: "{{ ocp_existing_nads.resources | map(attribute='metadata.name') | list }}"

- name: "{{ role_name }} | nad | Determine if any nads are missing"
  ansible.builtin.set_fact:
    missing_ocp_nad: "{{ expected_nad_names | difference(existing_nad_names) }}"

