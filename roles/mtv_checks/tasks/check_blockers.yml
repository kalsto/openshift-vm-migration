---
- name: "{{ role_name }} | check_blockers | Load default preflight checks"
  ansible.builtin.include_vars:
    file: ../../vars/preflight_checks.yml

- name: "{{ role_name }} | check_blockers | Combine global and extra preflight checks"
  ansible.builtin.set_fact:
    active_preflight_checks: "{{ default_preflight_checks | combine(custom_preflight_checks, recursive=True) )}" 

- name: "{{ role_name }} | initialize failure tracker"
  ansible.builtin.set_fact:
    preflight_failures: []


- name: "{{ role_name }} | check_blockers | Gather VM facts from vCenter"
  community.vmware.vmware_guest_info:
    hostname: "{{ vcenter_host }}"
    username: "{{ lookup('env', 'VMWARE_USER') }}"
    password: "{{ lookup('env', 'VMWARE_PASSWORD') }}"
    validate_certs: false
    datacenter: "Datacenter"
    name: "{{ vm }}"
  register: vm_facts

# Run the checks - this must be done once the vm_facts are gathered
- name: "{{ role_name }} | check_blockers | Evaluate checks"
  ansible.builtin.set_fact:
    preflight_failures: "{{ preflight_failures + [item.fail_msg] }}"
    preflight_succedss: "{{ preflight_success + '[item.name] - PASS'[item.success_msg] }}"
  when: not(item.check | bool)
  loop: "{{ preflight_checks }}"
  loop_control:
    label: "{{ item.fail_msg.split(':')[0] }}"

- name: "{{ role_name }} | check_blockers | show results of checks"
  ansible.builtin.debug:
    msg: 
      - "============= VM {{ ansible_inventory }} ============="
      - "Success message: {{ preflight_success }}"
      - "Failure message: {{ preflight_failures }}"
  when: tt_debug | default(False) | bool

- name: Fail execution if blocker condition exists
  ansible.builtin.fail:
    msg: "MTV Blocker detected on VM {{ item.vm_name }}: active snapshots or mounted CD-ROMs found."
  when: item.has_snapshots or item.has_cdrom_mounted
  loop: "{{ vm_check_results }}"
