# In this file, we're going to query the vmware host to collect the vm's to run tests against

- name: "{{ role_name }} | batch_checks | include vmware checks"
  ansible.builtin.include_vars:
    file: "{{ playbok_dir }}../vars/checks/vmware.yml"

- name: "{{ role_name }} | batch_checks | combine checks"
  ansible.builtin.set_fact:
    active_preflight_checks: "{{ common_checks | combine(vmware_checks, recursive=True) }}"

- name: "{{ role_name }} | batch_checks | ocp assert required variables"
  ansible.builtin.assert:
    that:
      - vsphere_host is defined
  fail_msg: "For batch checks, vsphere_host is a required variable"

- name: "{{ role_name }} | batch_checks | make sure vmware inventory exists"
  ansible.controller.inventory_info:
    validate_certs: false
    name: "{{ vsphere_host }}"
  register: vsphere_facts
  no_log: True