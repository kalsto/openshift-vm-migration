---
# tasks file for ocp_nad
#
# Need:
#  cluster ocp name
#  vlans
#  cluster console api
#  ocp login creds or token

- name: "{{ role_name }} | task_main | debug"
  ansible.builtin.debug:
    msg: 
      - "Here's some critical things:"
      - "k8s host: {{ lookup('env', 'K8S_AUTH_HOST') | default('not found') }}"
      - "k8s token: {{ lookup('env', 'K8S_AUTH_API_KEY') | default('not found') }}"
      - "openshift_token: {{ openshift_token | default('all group vars not being processed') }}"
      - "openshift_host: {{ openshift_host | default('all group vars not being processed') }}"
  when:
    - mtv_tt_debug | default (false)

- name: "{{ role_name }} | task_main"
  ansible.builtin.debug:
    msg: "vsphere_host is {{ ansible_host }}" 
  when:
    - mtv_tt_debug | default(false)

- name: "{{ role_name }} | task_main"
  ansible.builtin.debug:
    msg: "required vlans are: {{ ocp_required_vlans }}"
  when:
    - mtv_tt_debug | default(false)

- name: "{{ role_name }} | task_main | assert"
  ansible.builtin.assert:
    that:
      - openshift_token != 'tbd'
      - openshift_host != 'tbd'
    fail_msg: "Either openshift_token or openshift_host haven't been set properly"

- name: "{{ role_name }} | task_main | check for nads"
  ansible.builtin.include_tasks:
    file: check.yaml
