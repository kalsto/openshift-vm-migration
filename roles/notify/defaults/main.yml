---
# defaults file for notify
#
#
nofity_target: "slack"

notify_severity: "info"
notify_title: "Ansible Notification"
notify_message: "No message specified"

notify_slack_webhook_url: "{{ tt_notify_slack_webhook_url }}"



notify_color_map:
  info: "#36a64f"     # Green
  warning: "#ffcc00"  # Yellow
  error: "#ff0000"    # Red

notify_emoji_map:
  info: ":information_source:"
  warning: ":warning:"
  error: ":x:"
