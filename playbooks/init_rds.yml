---
- name: Initialize RDS Databases for AAP on OpenShift
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_namespace: "{{ aap_namespace | default('ansible-automation-platform') }}"
    openshift_host: "{{ openshift_host | default(vault_openshift_host | default(omit)) }}"
    openshift_username: "{{ openshift_username | default(vault_openshift_username | default('cluster-admin')) }}"
    openshift_password: "{{ openshift_password | default(vault_openshift_password | default(omit)) }}"
    rds_host: "{{ rds_host | default(vault_rds_host | default(omit)) }}"
    rds_user: "{{ rds_user | default(vault_rds_master_user | default('dbadmin')) }}"
    rds_password: "{{ rds_password | default(vault_rds_password | default(omit)) }}"

    # K8s Database Secret Names
    gateway_db_secret: "{{ gateway_db_secret | default('rds-gateway-configuration') }}"
    controller_db_secret: "{{ controller_db_secret | default('rds-controller-configuration') }}"
    hub_db_secret: "{{ hub_db_secret | default('rds-hub-configuration') }}"

  pre_tasks:
    - name: Dynamically load environment variables if env_target is defined
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../vars/{{ env_target }}_config.yml"
        - "{{ playbook_dir }}/../vars/vault_{{ env_target }}.yml"
      when: env_target is defined
      ignore_errors: true

  tasks:
    - name: Authenticate against OpenShift OAuth
      kubernetes.core.k8s_auth:
        host: "{{ openshift_host }}"
        username: "{{ openshift_username }}"
        password: "{{ openshift_password }}"
        validate_certs: false
      register: k8s_auth_results

    - name: Ensure Target Namespace Exists
      kubernetes.core.k8s:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        api_version: v1
        kind: Namespace
        name: "{{ aap_namespace }}"
        state: present

    - name: Delete Old Initialization Job If Present
      kubernetes.core.k8s:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        state: absent
        api_version: batch/v1
        kind: Job
        name: rds-init-job
        namespace: "{{ aap_namespace }}"

    - name: Run Database Initialization Job on OpenShift
      kubernetes.core.k8s:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: rds-init-job
            namespace: "{{ aap_namespace }}"
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: pg-init
                    image: registry.redhat.io/rhel9/postgresql-15
                    env:
                      - name: PGPASSWORD
                        value: "{{ rds_password }}"
                      - name: PGSSLMODE
                        value: "require"
                    command:
                      - /bin/bash
                      - -c
                      - |
                        set -e
                        echo "Connecting to {{ rds_host }}..."

                        for db in aap_gateway aap_controller aap_hub; do
                          psql -h {{ rds_host }} -U {{ rds_user }} -d postgres -c "DROP DATABASE IF EXISTS $db WITH (FORCE);"
                          psql -h {{ rds_host }} -U {{ rds_user }} -d postgres -c "CREATE DATABASE $db OWNER {{ rds_user }};"
                        done

                        psql -h {{ rds_host }} -U {{ rds_user }} -d aap_hub -c "CREATE EXTENSION IF NOT EXISTS hstore;"
                        echo "PostgreSQL initialization completed successfully!"

    - name: Wait for Job to Succeed
      kubernetes.core.k8s_info:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        api_version: batch/v1
        kind: Job
        name: rds-init-job
        namespace: "{{ aap_namespace }}"
      register: init_job_info
      until: >
        init_job_info.resources | length > 0 and
        (init_job_info.resources[0].status.succeeded | default(0)) > 0
      retries: 30
      delay: 10

    # -------------------------------------------------------------------------
    # Create OpenShift Database Configuration Secrets (Enforcing SSL for RDS)
    # -------------------------------------------------------------------------
    - name: Create OpenShift Database Configuration Secrets
      kubernetes.core.k8s:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ aap_namespace }}"
          type: Opaque
          stringData:
            host: "{{ rds_host }}"
            port: "5432"
            database: "{{ item.db }}"
            username: "{{ rds_user }}"
            password: "{{ rds_password }}"
            sslmode: "require"
            type: "unmanaged"
      loop:
        - { name: "{{ gateway_db_secret }}", db: "aap_gateway" }
        - { name: "{{ controller_db_secret }}", db: "aap_controller" }
        - { name: "{{ hub_db_secret }}", db: "aap_hub" }