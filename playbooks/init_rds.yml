---
- name: Initialize RDS Databases for AAP on OpenShift via ESO
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # -------------------------------------------------------------------------
    # Authentication & Namespace
    # -------------------------------------------------------------------------
    - name: Authenticate against OpenShift OAuth
      kubernetes.core.k8s_auth:
        host: "{{ openshift_host }}"
        username: "{{ openshift_username }}"
        password: "{{ openshift_password }}"
        validate_certs: false
      register: k8s_auth_results

    - name: Ensure Target Namespace Exists
      kubernetes.core.k8s:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        api_version: v1
        kind: Namespace
        name: "{{ aap_namespace }}"
        state: present

    # -------------------------------------------------------------------------
    # 1. Apply ExternalSecrets to Fetch AWS RDS Credentials via ESO
    # -------------------------------------------------------------------------
    - name: Create ExternalSecret Resources for AAP Databases
      kubernetes.core.k8s:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ aap_namespace }}"
            annotations:
              force-sync: "{{ lookup('pipe', 'date +%s') }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              kind: ClusterSecretStore
              name: aws-secrets-manager
            target:
              name: "{{ item.name }}"
              creationPolicy: Owner
              deletionPolicy: Retain
              template:
                engineVersion: v2
                mergePolicy: Replace
                data:
                  host: "{{ rds_host }}"
                  port: "5432"
                  database: "{{ item.db }}"
                  username: "{{ '{{' }} .username {{ '}}' }}"
                  password: "{{ '{{' }} .password {{ '}}' }}"
                  sslmode: "require"
                  type: "unmanaged"
            dataFrom:
              - extract:
                  key: "{{ aws_secret_id }}"
      loop:
        - { name: "{{ gateway_db_secret }}", db: "aap_gateway" }
        - { name: "{{ controller_db_secret }}", db: "aap_controller" }
        - { name: "{{ hub_db_secret }}", db: "aap_hub" }
        - { name: "{{ eda_db_secret }}", db: "aap_eda" }

    - name: Wait for ESO to Sync Kubernetes Secrets
      kubernetes.core.k8s_info:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ aap_namespace }}"
      loop:
        - "{{ gateway_db_secret }}"
        - "{{ controller_db_secret }}"
        - "{{ hub_db_secret }}"
        - "{{ eda_db_secret }}"
      register: eso_secrets
      until: >
        eso_secrets.resources | default([]) | length > 0 and
        (eso_secrets.resources[0].data.password | default('') | length) > 0
      retries: 30
      delay: 5

    # -------------------------------------------------------------------------
    # 2. Run Database Initialization Job (Using K8s Secret Ref)
    # -------------------------------------------------------------------------
    - name: Delete Old Initialization Job If Present
      kubernetes.core.k8s:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        state: absent
        api_version: batch/v1
        kind: Job
        name: rds-init-job
        namespace: "{{ aap_namespace }}"

    - name: Run Database Initialization Job on OpenShift
      kubernetes.core.k8s:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: rds-init-job
            namespace: "{{ aap_namespace }}"
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: pg-init
                    image: registry.redhat.io/rhel9/postgresql-15
                    env:
                      - name: PGHOST
                        valueFrom:
                          secretKeyRef:
                            name: "{{ gateway_db_secret }}"
                            key: host
                      - name: PGUSER
                        valueFrom:
                          secretKeyRef:
                            name: "{{ gateway_db_secret }}"
                            key: username
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: "{{ gateway_db_secret }}"
                            key: password
                      - name: PGSSLMODE
                        value: "require"
                    command:
                      - /bin/bash
                      - -c
                      - |
                        set -e
                        echo "Connecting to $PGHOST as $PGUSER..."

                        for db in aap_gateway aap_controller aap_hub aap_eda; do
                          psql -h $PGHOST -U $PGUSER -d postgres -c "DROP DATABASE IF EXISTS $db WITH (FORCE);"
                          psql -h $PGHOST -U $PGUSER -d postgres -c "CREATE DATABASE $db OWNER $PGUSER;"
                        done

                        psql -h $PGHOST -U $PGUSER -d aap_hub -c "CREATE EXTENSION IF NOT EXISTS hstore;"
                        echo "PostgreSQL initialization completed successfully!"

    - name: Wait for Database Initialization Job to Succeed
      kubernetes.core.k8s_info:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        api_version: batch/v1
        kind: Job
        name: rds-init-job
        namespace: "{{ aap_namespace }}"
      register: init_job_info
      until: >
        init_job_info.resources | default([]) | length > 0 and
        (init_job_info.resources[0].status.succeeded | default(0)) > 0
      retries: 30
      delay: 10