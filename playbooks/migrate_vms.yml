---
- name: Execute OpenShift Virtualization VM Migration via Roles
  hosts: all
  connection: local
  gather_facts: false
  run_once: true

  vars_files:
    - "../vars/vault.yml"
    - "../vars/mty.yml"

  pre_tasks:
    - name: Validate host limit is defined and not 'all'
      ansible.builtin.assert:
        that:
          - ansible_limit is defined or limit is defined
          - (ansible_limit | default(limit | default(''))) | trim | length > 0
          - (ansible_limit | default(limit | default(''))) | trim | lower != 'all'
          - (ansible_limit | default(limit | default(''))) | trim | lower != '*'
        fail_msg: "MIGRATION ABORTED! You must specify a specific VM limit. 'all' or '*' is not allowed."

    - name: Dynamically resolve Target OpenShift Cluster credentials from Vault
      ansible.builtin.set_fact:
        openshift_server: "{{ vault_target_mty_openshift_host }}"
        openshift_api_key: "{{ vault_target_mty_openshift_token }}"
      when: selected_openshift_cluster | default('MTY Cluster') == 'MTY Cluster'

    - name: Dynamically resolve Source vCenter credentials from Vault
      ansible.builtin.set_fact:
        vsphere_direct_host: "{{ vault_vcenter_chidebmockvc01_host }}"
        vsphere_url: "{{ vault_vsphere_chidebmockvc01_url }}"
        vsphere_user: "{{ vault_vcenter_chidebmockvc01_username }}"
        vsphere_password: "{{ vault_vcenter_chidebmockvc01_password }}"
        mtv_provider_cr_name: "{{ vault_vcenter_chidebmockvc01_fqdn }}"
      when: selected_vcenter | default('chidebmockvc01') == 'chidebmockvc01'

    - name: Set environment facts for Kubernetes module authentication
      ansible.builtin.set_fact:
        ansible_env_k8s_auth:
          K8S_AUTH_HOST: "{{ openshift_server }}"
          K8S_AUTH_API_KEY: "{{ openshift_api_key }}"
          K8S_AUTH_VERIFY_SSL: "false"

    - name: Build source_vms list from selected inventory hosts
      ansible.builtin.set_fact:
        source_vms: "{{ raw_vms_list | from_yaml }}"
      vars:
        raw_vms_list: |
          {% for h in ansible_play_batch if h not in ['localhost', '127.0.0.1'] %}
          - name: "{{ h }}"
          {% endfor %}

    - name: Display Execution Summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "  MIGRATION EXECUTION SUMMARY                                 "
          - "============================================================"
          - "  Target Limit:       {{ ansible_limit | default(limit) }}"
          - "  Source vCenter:     {{ selected_vcenter }} ({{ vsphere_direct_host }})"
          - "  Target OpenShift:   {{ selected_openshift_cluster }} ({{ openshift_server }})"
          - "  Target Namespace:   {{ target_namespace }}"
          - "  Warm Migration:     {{ is_warm }}"
          - "============================================================"

    - name: Power off source VMs in vSphere when performing cold migration
      community.vmware.vmware_guest:
        hostname: "{{ vsphere_direct_host }}"
        username: "{{ vsphere_user }}"
        password: "{{ vsphere_password }}"
        validate_certs: false
        name: "{{ item.name }}"
        state: poweredoff
      loop: "{{ source_vms }}"
      when: not is_warm
      delegate_to: localhost

  tasks:
    - name: Ensure Target Namespace Exists on Target Cluster
      kubernetes.core.k8s:
        host: "{{ openshift_server }}"
        api_key: "{{ openshift_api_key }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ target_namespace }}"

    - name: Ensure Global ForkliftController Uses VDDK Image
      kubernetes.core.k8s:
        host: "{{ openshift_server }}"
        api_key: "{{ openshift_api_key }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: ForkliftController
          metadata:
            name: forklift-controller
            namespace: "{{ mtv_namespace }}"
          spec:
            vddk_init_image: "image-registry.openshift-image-registry.svc:5000/openshift-mtv/vddk:latest"

    - name: Provision Secrets, Providers, Maps, and Migration Plans
      ansible.builtin.include_role:
        name: infra.openshift_virtualization_migration.mtv_management
      environment: "{{ ansible_env_k8s_auth }}"

    - name: Trigger Migration Executions and Monitor Progress
      ansible.builtin.include_role:
        name: infra.openshift_virtualization_migration.mtv_migrate
      environment: "{{ ansible_env_k8s_auth }}"