---
- name: Execute OpenShift Virtualization VM Migration via Roles
  hosts: all
  connection: local
  gather_facts: false
  run_once: true

  vars_files:
    - "../vars/vault.yml"

  pre_tasks:
    - name: Dynamically include target cluster variables (mty vs mda)
      ansible.builtin.include_vars:
        file: "../vars/{{ 'mda.yml' if (selected_openshift_cluster | default('MTY Cluster') == 'MDA Cluster') else 'mty.yml' }}"

    - name: Validate that a specific target host limit is defined
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | trim | length > 0
          - ansible_limit | trim | lower != 'all'
          - ansible_limit | trim | lower != '*'
        fail_msg: "MIGRATION ABORTED! You must specify a specific VM limit via the AAP Limit prompt."

    - name: Dynamically resolve Target OpenShift Cluster credentials from Vault
      ansible.builtin.set_fact:
        openshift_server: "{{ vault_mda_target_openshift_host if (selected_openshift_cluster | default('MTY Cluster') == 'MDA Cluster') else vault_mty_target_openshift_host }}"
        openshift_api_key: "{{ vault_mda_target_openshift_token if (selected_openshift_cluster | default('MTY Cluster') == 'MDA Cluster') else vault_mty_target_openshift_token }}"

    - name: Set dynamic names for migration execution
      ansible.builtin.set_fact:
        migration_plan_name: "vm-migration-plan-{{ now(utc=True, fmt='%Y%m%d-%H%M%S') }}"
        network_map_name: "dynamic-network-map"

    - name: Build source_vms list from native AAP limit
      ansible.builtin.set_fact:
        source_vms: "{{ raw_vms_list | from_yaml }}"
      vars:
        raw_vms_list: |
          {% for h in ansible_play_batch if h not in ['localhost', '127.0.0.1'] %}
          - name: "{{ h }}"
          {% endfor %}

    - name: Validate that target VMs were resolved
      ansible.builtin.assert:
        that:
          - source_vms is defined
          - source_vms | length > 0
        fail_msg: "No valid VMs matched the limit '{{ ansible_limit }}'! Check VM name spelling or inventory sync."

    - name: Query vCenter for network interfaces on target VMs
      community.vmware.vmware_guest_info:
        hostname: "{{ vsphere_direct_host }}"
        username: "{{ vsphere_user }}"
        password: "{{ vsphere_password }}"
        validate_certs: false
        datacenter: ""
        name: "{{ item.name }}"
      loop: "{{ source_vms }}"
      register: target_vms_info
      delegate_to: localhost

    - name: Extract unique vCenter network port groups from target VMs
      ansible.builtin.set_fact:
        discovered_networks: "{{ target_vms_info.results | map(attribute='instance.network_data') | select('defined') | flatten | map(attribute='network') | unique | list }}"

    - name: Construct native network mapping list
      ansible.builtin.set_fact:
        generated_network_mapping: "{{ generated_network_mapping | default([]) + [{'source': {'name': item}, 'destination': {'type': 'pod'}}] }}"
      loop: "{{ discovered_networks }}"

    - name: Dynamically construct mtv_network_maps
      ansible.builtin.set_fact:
        mtv_network_maps:
          - name: "{{ network_map_name }}"
            namespace: "{{ mtv_namespace }}"
            source_provider: "{{ mtv_provider_cr_name }}"
            destination_provider: "host"
            map: "{{ generated_network_mapping }}"

    - name: Synchronize mtv_management_network_maps fact
      ansible.builtin.set_fact:
        mtv_management_network_maps: "{{ mtv_network_maps }}"

    - name: Display Execution Summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "  MIGRATION EXECUTION SUMMARY                                 "
          - "============================================================"
          - "  Plan Name:          {{ migration_plan_name }}"
          - "  Network Map:        {{ network_map_name }}"
          - "  Storage Map:        {{ storage_map_name }}"
          - "  Target Limit:       {{ ansible_limit }}"
          - "  Source vCenter:     {{ vsphere_direct_host }}"
          - "  Target OpenShift:   {{ selected_openshift_cluster | default('MTY Cluster') }} ({{ openshift_server }})"
          - "  Target Namespace:   {{ target_namespace }}"
          - "  Warm Migration:     {{ is_warm }}"
          - "  Discovered VLANs:   {{ discovered_networks }}"
          - "============================================================"

    - name: Power off source VMs in vSphere when performing cold migration
      community.vmware.vmware_guest:
        hostname: "{{ vsphere_direct_host }}"
        username: "{{ vsphere_user }}"
        password: "{{ vsphere_password }}"
        validate_certs: false
        name: "{{ item.name }}"
        state: poweredoff
      loop: "{{ source_vms }}"
      when: not is_warm
      delegate_to: localhost

  tasks:
    - name: Ensure Target Namespace Exists on Target Cluster
      kubernetes.core.k8s:
        host: "{{ openshift_server }}"
        api_key: "{{ openshift_api_key }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ target_namespace }}"

    - name: Ensure Global ForkliftController Uses VDDK Image
      kubernetes.core.k8s:
        host: "{{ openshift_server }}"
        api_key: "{{ openshift_api_key }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: ForkliftController
          metadata:
            name: forklift-controller
            namespace: "{{ mtv_namespace }}"
          spec:
            vddk_init_image: "image-registry.openshift-image-registry.svc:5000/openshift-mtv/vddk:latest"

    - name: Execute MTV Migration Roles with Target Cluster Environment
      environment:
        K8S_AUTH_HOST: "{{ openshift_server }}"
        K8S_AUTH_API_KEY: "{{ openshift_api_key }}"
        K8S_AUTH_VERIFY_SSL: "false"
      block:
        - name: Provision Secrets, Providers, Maps, and Migration Plans
          ansible.builtin.include_role:
            name: infra.openshift_virtualization_migration.mtv_management

        - name: Trigger Migration Executions and Monitor Progress
          ansible.builtin.include_role:
            name: infra.openshift_virtualization_migration.mtv_migrate