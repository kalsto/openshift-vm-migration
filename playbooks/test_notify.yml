---
- hosts: localhost
  name: "Testing {{ notify_target | default('slack') }} notifications"
  gather_facts: false


  tasks:
    - name: Testing simple notification
      ansible.builtin.include_role: 
        name: notify
      vars:
        notify_title: "Testing notification"
        notify_severity: "info"
        notify_message: "Testing to ensure slack notifications are working from AAP"
      
  
