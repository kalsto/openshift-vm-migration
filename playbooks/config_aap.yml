---
- name: AAP Configuration Management
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - ansible.controller
    - infra.ah_configuration
    - kubernetes.core

  tasks:
    # -------------------------------------------------------------------------
    # 1. Fetch Cluster Auth & Target AAP Credentials
    # -------------------------------------------------------------------------
    - name: Authenticate against OpenShift Cluster
      kubernetes.core.k8s_auth:
        host: "{{ openshift_host }}"
        username: "{{ openshift_username }}"
        password: "{{ openshift_password }}"
        validate_certs: false
      register: k8s_auth_results

    - name: Get Admin Password from Secret
      kubernetes.core.k8s_info:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        api_version: v1
        kind: Secret
        name: aap-admin-password
        namespace: "{{ aap_namespace }}"
      register: gateway_secret
      failed_when: false

    - name: Get AAP Route URL
      kubernetes.core.k8s_info:
        host: "{{ openshift_host }}"
        api_key: "{{ k8s_auth_results.k8s_auth.api_key }}"
        validate_certs: false
        api_version: route.openshift.io/v1
        kind: Route
        name: aap
        namespace: "{{ aap_namespace }}"
      register: aap_route
      failed_when: false

    - name: Set Connection Facts
      ansible.builtin.set_fact:
        aap_admin_password: "{{ (gateway_secret.resources[0].data.password | b64decode) if (gateway_secret.resources | default([]) | length > 0) else openshift_password }}"
        aap_url: "{{ ('https://' ~ aap_route.resources[0].spec.host) if (aap_route.resources | default([]) | length > 0) else fallback_aap_url }}"
        k8s_token: "{{ k8s_auth_results.k8s_auth.api_key }}"

    # -------------------------------------------------------------------------
    # 2. Dynamically Retrieve Automation Hub API Token for Controller Use
    # -------------------------------------------------------------------------
    - name: Obtain Automation Hub API Token via Basic Auth
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/galaxy/v3/auth/token/"
        method: POST
        user: "admin"
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        status_code: [200, 201]
        validate_certs: false
      register: ah_token_res
      until: ah_token_res.status in [200, 201]
      retries: 5
      delay: 5

    - name: Set Automation Hub Token Fact
      ansible.builtin.set_fact:
        ah_token: "{{ ah_token_res.json.token }}"

    # -------------------------------------------------------------------------
    # 3. Configure & Conditionally Sync Local Automation Hub Remotes
    # -------------------------------------------------------------------------
    - name: Configure Local Automation Hub Collection Remotes
      infra.ah_configuration.collection_remote:
        name: "{{ item.name }}"
        url: "{{ item.url }}"
        auth_url: "{{ item.auth_url | default(omit) }}"
        token: "{{ item.token | default(omit) }}"
        requirements: "{{ item.requirements | default(omit) }}"
        ah_host: "{{ aap_url }}"
        ah_username: "admin"
        ah_password: "{{ aap_admin_password }}"
        validate_certs: false
      loop: "{{ ah_collection_remotes | default([]) }}"

    - name: Inspect Automation Hub Remote Sync History
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/galaxy/pulp/api/v3/remotes/ansible/collection/?name={{ item.name }}"
        method: GET
        user: "admin"
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        status_code: [200]
        validate_certs: false
      loop: "{{ ah_collection_remotes | default([]) }}"
      register: ah_remotes_info

    - name: Trigger Repository Sync ONLY if Never Synced Before
      infra.ah_configuration.collection_repository_sync:
        name: "{{ item.item.name }}"
        ah_host: "{{ aap_url }}"
        ah_username: "admin"
        ah_password: "{{ aap_admin_password }}"
        validate_certs: false
        wait: true
      loop: "{{ ah_remotes_info.results | default([]) }}"
      when:
        - item.json.results is defined
        - item.json.results | length > 0
        - item.json.results[0].last_sync_task is none

    # -------------------------------------------------------------------------
    # 4. Provision AAP Controller Resources
    # -------------------------------------------------------------------------
    - name: Provision Controller Resources
      environment:
        CONTROLLER_HOST: "{{ aap_url }}"
        CONTROLLER_USERNAME: "admin"
        CONTROLLER_PASSWORD: "{{ aap_admin_password }}"
        CONTROLLER_FORCE_BASIC_AUTH: "true"
        CONTROLLER_VERIFY_SSL: "false"
      block:
        - name: Ensure Organizations Exist in AAP
          ansible.controller.organization:
            name: "{{ item.name }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ organizations | default([]) }}"

        - name: Create credentials in AAP
          ansible.controller.credential:
            name: "{{ item.name }}"
            description: "{{ item.description | default(omit) }}"
            organization: "{{ item.organization }}"
            credential_type: "{{ item.credential_type }}"
            inputs: "{{ item.inputs }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ credentials | default([]) }}"

        - name: Associate Galaxy Credentials with Organization
          ansible.controller.organization:
            name: "{{ item.name }}"
            galaxy_credentials: "{{ item.galaxy_credentials | default(omit) }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ organizations | default([]) }}"

        - name: Create projects in AAP
          ansible.controller.project:
            name: "{{ item.name }}"
            description: "{{ item.description | default(omit) }}"
            organization: "{{ item.organization }}"
            scm_type: "{{ item.scm_type }}"
            scm_url: "{{ item.scm_url }}"
            scm_credential: "{{ item.scm_credential | default(omit) }}"
            scm_branch: "{{ item.scm_branch | default(omit) }}"
            scm_update_on_launch: "{{ item.scm_update_on_launch | default(false) }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ projects | default([]) }}"

        - name: Sync Projects and WAIT for Collection Installs
          ansible.controller.project_update:
            name: "{{ item.name }}"
            wait: true
          loop: "{{ projects | default([]) }}"

        - name: Create Inventory Containers in AAP
          ansible.controller.inventory:
            name: "{{ item.name }}"
            description: "{{ item.description | default(omit) }}"
            organization: "{{ item.organization }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ inventories | default([]) }}"

        - name: Remove Existing Inventory Sources to Clear Stale Attributes
          ansible.controller.inventory_source:
            name: "{{ item.name }} Source"
            inventory: "{{ item.name }}"
            state: "absent"
          loop: "{{ inventories | default([]) }}"

        - name: Link Inventory Sources
          ansible.controller.inventory_source:
            name: "{{ item.name }} Source"
            inventory: "{{ item.name }}"
            source: "{{ item.source | default('vmware') }}"
            credential: "{{ item.credential | default(omit) }}"
            source_project: "{{ item.source_project if (item.source | default('vmware') == 'scm') else omit }}"
            source_path: "{{ item.source_path if (item.source | default('vmware') == 'scm') else omit }}"
            source_vars: "{{ item.source_vars | default(omit) }}"
            overwrite: "{{ item.overwrite | default(true) }}"
            overwrite_vars: "{{ item.overwrite_vars | default(true) }}"
            update_on_launch: "{{ item.update_on_launch | default(true) }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ inventories | default([]) }}"

        - name: Trigger Async Inventory Source Syncs
          ansible.controller.inventory_source_update:
            inventory_source: "{{ item.name }} Source"
            inventory: "{{ item.name }}"
            wait: false
          loop: "{{ inventories | default([]) }}"
          ignore_errors: true

        - name: Create job templates from configuration
          ansible.controller.job_template:
            name: "{{ item.name }}"
            project: "{{ item.project }}"
            inventory: "{{ item.inventory }}"
            playbook: "{{ item.playbook }}"
            organization: "{{ item.organization }}"
            credentials: "{{ item.credentials }}"
            ask_credential_on_launch: "{{ item.ask_credential_on_launch | default(false) }}"
            ask_inventory_on_launch: "{{ item.ask_inventory_on_launch | default(false) }}"
            ask_limit_on_launch: "{{ item.ask_limit_on_launch | default(true) }}"  # Enforces required limit on launch
            survey_enabled: "{{ true if item.survey_path is defined else false }}"
            survey_spec: "{{ lookup('file', playbook_dir + '/../' + item.survey_path) | from_json if item.survey_path is defined else omit }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ job_templates | default([]) }}"