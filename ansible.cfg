[galaxy]
server_list = local_published, local_community, automation_hub, automation_hub_validated, galaxy

[galaxy_server.local_published]
url = https://aap-ansible-automation-platform.apps.rosa.tt-rosa-int.6gxv.p3.openshiftapps.com/api/galaxy/content/published/
token = ${LOCAL_HUB_TOKEN}

[galaxy_server.local_community]
url = https://aap-ansible-automation-platform.apps.rosa.tt-rosa-int.6gxv.p3.openshiftapps.com/api/galaxy/content/community/
token = ${LOCAL_HUB_TOKEN}

[galaxy_server.automation_hub]
