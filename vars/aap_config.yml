# ==============================================================================
# AAP Predefined Resources
# File: vars/aap_config.yml
# ==============================================================================

aap_organization: "Default"

# ------------------------------------------------------------------------------
# Automation Hub Remote Synchronization Filters
# ------------------------------------------------------------------------------
ah_collection_remotes:
  - name: "rh-certified"
    url: "https://console.redhat.com/api/automation-hub/"
    auth_url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token"
    token: "{{ vault_rh_offline_token }}"
    requirements:
      - "redhat.openshift"
      - "redhat.openshift_virtualization"
      - "ansible.controller"
      - "kubernetes.core"
      - "ansible.utils"
      - "ansible.posix"
      - "vmware.vmware_rest"

  - name: "community"
    url: "https://galaxy.ansible.com/api/"
    requirements:
      - "community.vmware"
      - "community.general"
      - "infra.aap_utilities"
      - "community.crypto"
      - "containers.podman"
      - "community.library_inventory_filtering_v1"
      - "community.postgresql"
      - "vmware.vmware"

# ------------------------------------------------------------------------------
# Credentials
# ------------------------------------------------------------------------------
credentials:
  - name: "Ansible Vault Credential"
    description: "Vault password for decrypting playbook vault.yml files"
    organization: "{{ aap_organization }}"
    credential_type: "Vault"
    inputs:
      vault_password: "{{ vault_ansible_password }}"
    state: "present"

  - name: "Local Automation Hub Published"
    description: "Internal Automation Hub Published Content"
    organization: "{{ aap_organization }}"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    inputs:
      url: "{{ vault_local_published_url }}"
      token: "{{ vault_local_hub_token }}"
    state: "present"

  - name: "Local Automation Hub Community"
    description: "Internal Automation Hub Community Content"
    organization: "{{ aap_organization }}"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    inputs:
      url: "{{ vault_local_community_url }}"
      token: "{{ vault_local_hub_token }}"
    state: "present"

  - name: "Local Automation Hub Certified"
    description: "Internal Automation Hub Red Hat Certified Content"
    organization: "{{ aap_organization }}"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    inputs:
      url: "{{ vault_local_certified_url }}"
      token: "{{ vault_local_hub_token }}"
    state: "present"

  - name: "Red Hat Automation Hub Credential"
    description: "Automation Hub API Token for Red Hat Certified Collections"
    organization: "{{ aap_organization }}"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    inputs:
      url: "{{ vault_automation_hub_url }}"
      auth_url: "{{ vault_automation_hub_auth_url }}"
      token: "{{ vault_rh_offline_token }}"
    state: "present"

  - name: "Ansible Galaxy Credential"
    description: "Public Ansible Galaxy server for community collections"
    organization: "{{ aap_organization }}"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    inputs:
      url: "{{ vault_galaxy_url }}"
    state: "present"

  - name: "vCenter Credentials"
    description: "Source VMware vCenter Credentials for VM Migration"
    organization: "{{ aap_organization }}"
    credential_type: "VMware vCenter"
    inputs:
      host: "{{ vault_vcenter_host }}"
      username: "{{ vault_vcenter_username }}"
      password: "{{ vault_vcenter_password }}"
    state: "present"

  - name: "Target OpenShift Cluster API Credential"
    description: "Bearer Token for target OpenShift Virtualization Cluster"
    organization: "{{ aap_organization }}"
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ vault_target_openshift_host }}"
      bearer_token: "{{ vault_target_openshift_token }}"
    state: "present"

  - name: "GitHub Deploy Key Credential"
    description: "SSH Private Key for GitHub SCM Repositories"
    organization: "{{ aap_organization }}"
    credential_type: "Source Control"
    inputs:
      ssh_key_data: "{{ vault_github_deploy_key_private }}"
    state: "present"

# ------------------------------------------------------------------------------
# Organizations
# ------------------------------------------------------------------------------
organizations:
  - name: "{{ aap_organization }}"
    galaxy_credentials:
      - "Local Automation Hub Published"
      - "Local Automation Hub Community"
      - "Local Automation Hub Certified"
      - "Red Hat Automation Hub Credential"
      - "Ansible Galaxy Credential"
    state: "present"

# ------------------------------------------------------------------------------
# Projects
# ------------------------------------------------------------------------------
projects:
  - name: "tt-openshift-virt"
    description: "Git repository containing VM migration playbooks"
    organization: "{{ aap_organization }}"
    scm_type: "git"
    scm_url: "{{ vault_github_scm_url }}"
    scm_credential: "GitHub Deploy Key Credential"
    scm_branch: "main"
    scm_update_on_launch: false
    state: "present"

# ------------------------------------------------------------------------------
# Inventories & VMware Dynamic Sources
# ------------------------------------------------------------------------------
inventories:
  - name: "VM Migration Inventory"
    description: "Dynamic inventory synced directly from VMware vCenter"
    organization: "{{ aap_organization }}"
    source: "vmware"
    credential: "vCenter Credentials"
    source_vars:
      plugin: community.vmware.vmware_vm_inventory
      validate_certs: false
      with_tags: false
      strict: false
      hostnames:
        - name
        - config.name
    state: "present"

# ------------------------------------------------------------------------------
# Job Templates
# ------------------------------------------------------------------------------
job_templates:
  - name: "01 - Execute OpenShift VM Migration"
    organization: "{{ aap_organization }}"
    project: "tt-openshift-virt"
    inventory: "VM Migration Inventory"
    playbook: "playbooks/migrate_vms.yml"
    credentials:
      - "vCenter Credentials"
      - "Target OpenShift Cluster API Credential"
      - "Ansible Vault Credential"
    state: "present"