# ==============================================================================
# MTV Migration Configuration for MDA Target Cluster
# File: vars/mda.yml
# ==============================================================================

openshift_server: "{{ vault_mda_target_openshift_host }}"
openshift_api_key: "{{ vault_mda_target_openshift_token }}"
openshift_user: "{{ vault_mda_target_openshift_username }}"
openshift_password: "{{ vault_mda_target_openshift_password }}"
openshift_validate_certs: false

is_warm: "{{ warm_migration | default(false) | bool }}"
cutover_at: "{{ cutover_time | default(omit) }}"

mtv_namespace: "openshift-mtv"
target_namespace: "{{ target_namespace | default('dev-cluster') }}"

vsphere_direct_host: "{{ vault_chi_vcenter_host }}"
mtv_provider_cr_name: "{{ vault_chi_vcenter_fqdn }}"

provider: "vsphere"
mtv_management_source_target: "{{ mtv_provider_cr_name }}"
mtv_management_destination_target: "host"
mtv_management_provider_namespace: "{{ mtv_namespace }}"
mtv_management_map_storage: true
mtv_management_map_networks: true

vsphere_url: "{{ vault_chi_vsphere_url }}"
vsphere_user: "{{ vault_chi_vcenter_username }}"
vsphere_password: "{{ vault_chi_vcenter_password }}"
vsphere_insecure_skip_verify: true

vsphere_datastore: "workloadshare"
target_storage_class: "ocs-external-storagecluster-ceph-rbd"

# Dynamic Map Names
storage_map_name: "mda-storage-map"

mtv_secrets:
  - name: "vsphere-credentials"
    namespace: "{{ mtv_namespace }}"
    user: "{{ vsphere_user }}"
    password: "{{ vsphere_password }}"
    insecureSkipVerify: "{{ vsphere_insecure_skip_verify | string }}"
    url: "{{ vsphere_url }}"
mtv_management_secrets: "{{ mtv_secrets }}"

mtv_management_providers:
  - name: "{{ mtv_provider_cr_name }}"
    namespace: "{{ mtv_namespace }}"
    type: "vsphere"
    url: "{{ vsphere_url }}"
    secret: "vsphere-credentials"
    vddkInitImage: "image-registry.openshift-image-registry.svc:5000/openshift-mtv/vddk:latest"
  - name: "host"
    namespace: "{{ mtv_namespace }}"
    type: "openshift"

mtv_storage_maps:
  - name: "{{ storage_map_name }}"
    namespace: "{{ mtv_namespace }}"
    source_provider: "{{ mtv_provider_cr_name }}"
    destination_provider: "host"
    map:
      - source:
          name: "{{ vsphere_datastore }}"
        destination:
          storageClass: "{{ target_storage_class }}"
mtv_management_storage_maps: "{{ mtv_storage_maps }}"

mtv_plans: &mtv_plans
  - name: "{{ migration_plan_name }}"
    namespace: "{{ mtv_namespace }}"
    source_provider: "{{ mtv_provider_cr_name }}"
    destination_provider: "host"
    network_map: "{{ migration_plan_name }}-net-map"
    storage_map: "chidebmockvc01-int-tt-local-host"
    target_namespace: "{{ target_namespace }}"
    vms: "{{ source_vms }}"
    warm: "{{ is_warm }}"

mtv_migrate_migration_request:
  plan_name: "{{ migration_plan_name }}"
  mtv_namespace: "{{ mtv_namespace }}"
  target_namespace: "{{ target_namespace }}"
  source: "{{ mtv_provider_cr_name }}"
  destination: "host"
  network_map: "{{ migration_plan_name }}-net-map"
  storage_map: "chidebmockvc01-int-tt-local-host"
  start_migration: true
  verify_plans_ready: true
  verify_migrations_complete: true
  vms: "{{ source_vms }}"
  warm: "{{ is_warm }}"
  cutover: "{{ cutover_at if (is_warm and cutover_at is defined and cutover_at | length > 0) else omit }}"