---
min_os_version: 7


default_preflight_checks:
  - name: "os_version"
    check: "{{ ansible_distribution_major_version | int >= min_os_version }}"
    fail_msg: "UNSUPPORTED_OS: Found major version {{ ansible_distribution_major_version }}, needing {{ min_os_version }}+"
    success_msg: "OS is {{ ansible_distribution_major_version }}"

  - name: "temporary local account"
    check: "{{ temp_local_account in (ansible_facts.getent_passwd | default({})) }}"
    fail_msg: "USER MISSING: Required temporary local account is missing."
 
  # - name: "nad check"
  #   check: "{{ missing_ocp_nad | length == 0 }}"
  #   fail_msg: "Missing NAD: {{ missing_ocp_nad }}"



